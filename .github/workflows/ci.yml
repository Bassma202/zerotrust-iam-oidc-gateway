name: LIMEN IAM & OIDC Security CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-security:
    name: RS256 JWKS, SoD, Role Mining & SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Ruff static lint
        run: ruff check src tests scripts --select E9,F63,F7,F82

      - name: Bandit SAST
        run: bandit -r src scripts --severity-level high

      - name: Run full pytest suite
        run: pytest -v

  forge-reusable-security-gate:
    name: Cross-Project FORGE Reusable Security Gate
    uses: Bassma202/ai-devsecops-telegram-agent/.github/workflows/reusable-security-gate.yml@main
    with:
      python-version: "3.12"
      source-path: "src"
      run-pytest: false
