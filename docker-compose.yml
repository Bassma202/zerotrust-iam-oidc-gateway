# LIMEN Local Laboratory Identity Provider Stack (Keycloak 26.0.7 + PostgreSQL 16.6)
# NOTE: Configured for local loopback development. See docs/THREAT_MODEL.md for hardened TLS/production settings.
services:
  postgres:
    image: postgres:16.6-alpine
    container_name: limen_postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KC_DB_USERNAME:?Set KC_DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?Set KC_DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USERNAME} -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - limen_pg_data:/var/lib/postgresql/data
    networks:
      - limen_internal

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: limen_keycloak
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USERNAME:?Set KC_DB_USERNAME in .env}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?Set KC_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-limen-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set KC_BOOTSTRAP_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config/limen-realm.json:/opt/keycloak/data/import/limen-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - limen_internal

networks:
  limen_internal:
    driver: bridge

volumes:
  limen_pg_data:
